<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#FFFDF7" />
  
  <!-- Outer Glow / Soft Shadow -->
  <circle cx="256" cy="270" r="130" fill="#EBF8FF" opacity="0.6" filter="blur(10px)" />
  
  <!-- Meditating Silhouette / Lotus Shape -->
  <g transform="translate(128, 128) scale(0.5)">
    <!-- Right Leaf -->
    <path d="M 256 0 C 320 120, 480 200, 480 320 C 480 440, 360 480, 256 480" fill="#8ECAE6" opacity="0.8" />
    <!-- Left Leaf -->
    <path d="M 256 0 C 192 120, 32 200, 32 320 C 32 440, 152 480, 256 480" fill="#8ECAE6" opacity="0.8" />
    <!-- Center Lotus Leaf -->
    <path d="M 256 60 C 310 160, 400 240, 380 340 C 360 445, 256 460, 256 460 C 256 460, 152 445, 132 340 C 112 240, 202 160, 256 60 Z" fill="#FFF3D6" />
    <!-- Meditating center head -->
    <circle cx="256" cy="220" r="48" fill="#374151" />
    <!-- Meditating hands / body -->
    <path d="M 190 380 C 190 310, 322 310, 322 380 Z" fill="#374151" />
  </g>
</svg>
